# Reel CI: formatting/vet/tests, cross-platform build matrix, non-TTY smoke.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test (race)
        run: go test -race ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: build CLI
        run: go build -o /tmp/reel ./cmd/reel
      - name: render Markdown through a pipe (non-TTY)
        run: |
          printf '# Title\n\nhello **world**\n' > /tmp/smoke.md
          out=$(/tmp/reel md /tmp/smoke.md < /dev/null)
          echo "$out" | grep -q "hello" || { echo "smoke: missing text content"; exit 1; }
          if echo "$out" | grep -q $'\033_G'; then
            echo "smoke: graphics sequence leaked into non-TTY output"; exit 1
          fi
          echo "smoke OK: plain-text degradation on non-TTY"
